org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 enables built-in Kotlin by default; this project keeps the external Kotlin Gradle plugin (compose/serialization/KSP
# at the Kotlin 2.4.21 line), which the new DSL does not accept, so opt out to keep that path.
android.builtInKotlin=false
