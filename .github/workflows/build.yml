name: Build FlexNotes APK

# Releases only. Pull request checks live in pr.yml so they don't advance this workflow's run number, which the
# versionCode is built from (#78).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Pushes to main: signed release APK + full release post.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One release at a time, in push order. A push once started two runs for the same commit, and both published
    # (1.0.52 and 1.0.53), leaving the lower build marked Latest. Runs now queue here, and the guard below skips a
    # run whose commit already has a release.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    env:
      # Builds 1-3 were published from the earlier private repository, so numbering continues from there.
      # The build number is the app's versionCode and must only ever increase.
      BUILD_OFFSET: 3
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the release post can list every commit since the previous build.
          fetch-depth: 0

      - name: Skip a commit that already has a release
        id: guard
        run: |
          EXISTING=$(git tag --points-at HEAD --list 'build-*' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::notice::$GITHUB_SHA was already released as $EXISTING; this run publishes nothing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: steps.guard.outputs.skip != 'true'
        run: |
          BUILD=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))
          echo "FITLENS_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=1.0.$BUILD" >> "$GITHUB_ENV"

      # The signing key lives only in encrypted secrets. A release is never published without it,
      # because an APK signed with any other key can't update the installed app.
      - name: Restore signing key
        if: steps.guard.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FITLENS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::FITLENS_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flexnotes.keystore"
          echo "FITLENS_KEYSTORE=$RUNNER_TEMP/flexnotes.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.guard.outputs.skip != 'true'

      # Unused private code (#260): a private declaration whose name appears once in its own file is dead. A hard
      # failure; each finding is an `error:` line in build.log so it reaches errors.txt on ci-logs.
      - name: Check for unused private code (#260)
        if: steps.guard.outputs.skip != 'true'
        id: unused
        run: |
          set -o pipefail
          # Straight into build.log: the step stops at a failing check, so a later copy would never run.
          python3 -I .github/scripts/unused_private.py app/src 2>&1 | tee build.log
          # Every source file belongs to an audit area, so the audits can't quietly skip code.
          python3 -I .github/scripts/audit_coverage.py 2>&1 | tee -a build.log

      - name: Build release APK
        if: steps.guard.outputs.skip != 'true'
        id: build
        env:
          # A screenshot variant with no committed golden fails here (#306); PR runs record it instead.
          SCREENSHOT_STRICT: "true"
          FITLENS_STORE_PASSWORD: ${{ secrets.FITLENS_STORE_PASSWORD }}
          FITLENS_KEY_ALIAS: ${{ secrets.FITLENS_KEY_ALIAS }}
          FITLENS_KEY_PASSWORD: ${{ secrets.FITLENS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # The unit tests (#40) run first: a failing test stops the build, so nothing is published.
          ./gradlew testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee -a build.log
          rm -f "$FITLENS_KEYSTORE"
          # Local only: the release must never hold the internet permission, whatever a library merges in (#230).
          # Checked in the APK with aapt2, else in the merged release manifest; never skipped when neither is found.
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          MERGED=$(find app/build/intermediates -path '*merged_manifest*' -path '*release*' -name AndroidManifest.xml 2>/dev/null || true)
          if [ -n "$AAPT2" ]; then
            if "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q 'android.permission.INTERNET'; then
              echo "error: the release APK has the android.permission.INTERNET permission" | tee -a build.log
              exit 1
            fi
          elif [ -n "$MERGED" ]; then
            echo "aapt2 not found; checking the merged release manifests instead" | tee -a build.log
            if echo "$MERGED" | xargs grep -l 'android:name="android.permission.INTERNET"' 2>/dev/null; then
              echo "error: the merged release manifest has the android.permission.INTERNET permission" | tee -a build.log
              exit 1
            fi
          else
            echo "error: couldn't check the internet permission: no aapt2 and no merged release manifest" | tee -a build.log
            exit 1
          fi

      # Unused resources (#261): lint's UnusedResources check on the debug variant, a warning only. It runs after the
      # signed APK is built and can never fail the run or stop the release; the findings go in this step's log.
      - name: Lint unused resources (warning only)
        if: always() && steps.build.outcome == 'success' && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          ./gradlew lintDebug --console=plain 2>&1 | tee lint.log || true
          echo "::group::Unused resources"
          grep -E "UnusedResources|Warning:" lint.log | head -100 || echo "none found"
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
            cp app/build/reports/lint-results-debug.txt "$GITHUB_WORKSPACE/lint-results.txt"
          else
            echo "no lint text report"
          fi
          echo "::endgroup::"

      - name: Keep the unit test report
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Screenshot tests (#95): the golden images as this run saw them (any newly recorded ones included, ready to be
      # committed to app/src/test/screenshots/) and, when a screenshot changed, Roborazzi's diff images.
      - name: Keep the screenshots and any diffs
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            app/src/test/screenshots/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Package release files
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlexNotes-$VERSION.apk"
          git archive --format=zip --prefix="FlexNotes-$VERSION/" -o "dist/FlexNotes-$VERSION-source.zip" HEAD
          git archive --format=tar.gz --prefix="FlexNotes-$VERSION/" -o "dist/FlexNotes-$VERSION-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Keep release files as build artifact
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FlexNotes-${{ env.VERSION }}
          path: dist/*

      # The release post = RELEASE_NOTES.md (the hand-written update list for this build)
      # + issues resolved + install steps + a table of the attached files + the commits since the previous build.
      - name: Write release post
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          APK="FlexNotes-$VERSION.apk"
          size() { numfmt --to=iec --suffix=B "$(stat -c %s "dist/$1")"; }
          # Issues closed by "Fixes #N" / "Closes #N" / "Resolves #N" in this build's commits
          ISSUES=$(git log --format=%B "$RANGE" | grep -oiE '(fix(es|ed)?|close[sd]?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          {
            echo "# FlexNotes $VERSION"
            echo
            echo "**Build $FITLENS_BUILD** · $(date -u '+%d %B %Y') · commit [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)"
            echo
            if [ -s RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; else echo "_No release notes were written for this build._"; fi
            echo
            if [ -n "$ISSUES" ]; then
              echo "## Issues resolved"
              echo
              for n in $ISSUES; do
                line=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json title,labels \
                  --jq '(if any(.labels[]; .name == "bug") then "Bug fix" else "Feature" end) + ": " + .title' 2>/dev/null || echo "")
                echo "- #$n ${line}"
              done
              echo
            fi
            echo "## Install"
            echo
            echo "1. On your Android phone, download **$APK** from the files below."
            echo "2. Open it and allow installs from your browser or file manager if Android asks."
            echo "3. It installs over any earlier FlexNotes build and keeps all your data."
            echo
            echo "Requires Android 10 or newer."
            echo
            echo "## Files"
            echo
            echo "| File | Size | Contents |"
            echo "| --- | --- | --- |"
            echo "| \`$APK\` | $(size "$APK") | Signed Android app, ready to install |"
            echo "| \`FlexNotes-$VERSION-source.zip\` | $(size "FlexNotes-$VERSION-source.zip") | Complete source code for this build |"
            echo "| \`FlexNotes-$VERSION-source.tar.gz\` | $(size "FlexNotes-$VERSION-source.tar.gz") | Same source code, tar.gz format |"
            echo "| \`SHA256SUMS.txt\` | $(size SHA256SUMS.txt) | Checksums to verify the downloads |"
            echo
            echo "## Commits in this build"
            echo
            git log --no-merges --format="- %s (\`%h\`)" "$RANGE"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changes:** ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...build-$FITLENS_BUILD"
            fi
          } > release-post.md

      - name: Publish release
        if: success() && steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ env.FITLENS_BUILD }}
          name: FlexNotes ${{ env.VERSION }}
          body_path: release-post.md
          files: dist/*

      # Writes the result and build log to the ci-logs branch so they can be read with plain git.
      - name: Record build result
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          RESULT="${{ steps.build.outcome }}"
          if [ "${{ steps.unused.outcome }}" = "failure" ]; then RESULT=failure; fi
          SHA="${{ github.sha }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q
          git config user.name "flexnotes-ci"
          git config user.email "flexnotes-ci@users.noreply.github.com"
          echo "run=${{ github.run_number }} build=${FITLENS_BUILD:-?} sha=$SHA result=$RESULT" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -E "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|AAPT|Execution failed| FAILED$|AssertionError|Exception at|Caused by" "$GITHUB_WORKSPACE/build.log" | head -300 > errors.txt || true
            tail -400 "$GITHUB_WORKSPACE/build.log" > build-tail.log
          fi
          if [ -f "$GITHUB_WORKSPACE/lint-results.txt" ]; then cp "$GITHUB_WORKSPACE/lint-results.txt" lint.txt; fi
          # The Room schema the build exported (#36), so it can be reviewed and committed with app/schemas/.
          if [ -d "$GITHUB_WORKSPACE/app/schemas" ]; then cp -r "$GITHUB_WORKSPACE/app/schemas" schemas; fi
          git add -A && git commit -qm "CI run ${{ github.run_number }}: $RESULT"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
