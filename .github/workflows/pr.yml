name: Check pull request

# Pull requests (including from forks and Dependabot) get a debug build only: no secrets, no release.
#
# This lives in its own workflow on purpose (#78). GitHub counts run numbers per workflow, and build.yml derives
# the release versionCode from its own run number. When this job lived in build.yml, every pull request build
# advanced that counter, so releases skipped numbers (1.0.8 was followed by 1.0.13). Keeping pull requests here
# leaves build.yml's counter to releases alone.

on:
  pull_request:

jobs:
  # Pull requests (including from forks): compile a debug build only. No secrets, no release.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The same unused-private-code gate as releases (#260), so a pull request that passes here passes there too.
      - name: Check for unused private code (#260)
        run: python3 -I .github/scripts/unused_private.py app/src
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: FlexNotes-pr-${{ github.event.pull_request.number }}-debug
          path: app/build/outputs/apk/debug/*.apk
      # Screenshot tests (#95): golden images (new ones are recorded on the first run) and any diffs.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: |
            app/src/test/screenshots/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
